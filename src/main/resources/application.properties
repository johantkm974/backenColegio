spring.application.name=reporta-api
server.port=${PORT:8080}

# Datasource (en local usa XAMPP MySQL; en producción usa Supabase PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/reporta_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate (sin dialect ni driver fijos: Spring Boot los detecta solos según la URL)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${APP_JWT_SECRET:MiClaveSecretaMuySeguraParaFirmarTokensJWT2026!ReportaIE_Gonzales}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Cloudinary (credenciales SOLO en variables de entorno del sistema o de la
# Run Configuration de IntelliJ: CLOUDINARY_CLOUD_NAME / CLOUDINARY_API_KEY /
# CLOUDINARY_API_SECRET). El ":" al final = valor por defecto vacío, para que
# el contexto (tests) arranque aunque aún no estén definidas.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Límites de subida de fotos (5 fotos de hasta 5 MB c/u)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
