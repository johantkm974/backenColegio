spring.application.name=demo

# Datasource MySQL (reporta_db creada previamente en XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/reporta_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (Jakarta)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=MiClaveSecretaMuySeguraParaFirmarTokensJWT2026!ReportaIE_Gonzales
app.jwt.expiration-ms=86400000

# Cloudinary (credenciales SOLO en variables de entorno del sistema o de la
# Run Configuration de IntelliJ: CLOUDINARY_CLOUD_NAME / CLOUDINARY_API_KEY /
# CLOUDINARY_API_SECRET). El ":" al final = valor por defecto vacío, para que
# el contexto (tests) arranque aunque aún no estén definidas.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Límites de subida de fotos (5 fotos de hasta 5 MB c/u)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
